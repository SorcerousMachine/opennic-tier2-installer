# OpenNIC root KSK for DNSSEC validation. Refreshed at install time by
# querying `dig DNSKEY . @195.201.99.61` and extracting the 257-flag record.
# Pinned here as a fallback only.
OPENNIC_ROOT_KSK_TAG="60820"
OPENNIC_ROOT_KSK_ALG="8"
OPENNIC_ROOT_KSK_DIGEST_TYPE="2"
OPENNIC_ROOT_KSK_KEY=""
