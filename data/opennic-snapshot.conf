# OpenNIC infrastructure snapshot used as fallback when the wiki cannot be
# fetched at install time. Refresh by running `scripts/refresh-opennic-config.sh`,
# which re-pulls https://wiki.opennic.org/opennic/tld-servers and the live
# root DNSKEY. Format is shell-sourceable.
#
# Last updated: 2026-05-02 (verified against live OpenNIC servers).

# Tier-1 nameserver IPs (root + TLD masters). Mix of IPv4 and IPv6.
# Used as the `masters` block for slaved zones.
OPENNIC_TIER1_IPS=(
    "195.201.99.61"          # ns0.opennic.glue
    "168.119.153.26"         # ns0.opennic.glue (alt)
    "161.97.219.84"          # ns2.opennic.glue
    "2001:470:4212:10:0:100:53:10"  # ns2.opennic.glue
    "104.168.144.17"         # ns3.opennic.glue
    "2001:470:8269::53"      # ns3.opennic.glue
    "163.172.168.171"        # ns4.opennic.glue
    "94.103.153.176"         # ns5.opennic.glue
    "2a02:990:219:1:ba:1337:cafe:3" # ns5.opennic.glue
    "207.192.71.13"          # ns6.opennic.glue
    "178.63.116.152"         # ns8.opennic.glue
    "2a01:4f8:141:4281::999" # ns8.opennic.glue
    "209.141.36.19"          # ns9.opennic.glue
    "188.226.146.136"        # ns10.opennic.glue
    "2a03:b0c0:0:1010::13f:6001"    # ns10.opennic.glue
)

# Active OpenNIC TLDs to slave. Verify with `dig @<tier1> <tld>. NS`.
